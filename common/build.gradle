dependencies {
    api "org.yaml:snakeyaml:${snakeyaml_version}"
    compileOnly "org.slf4j:slf4j-api:${slf4j_version}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.slf4j:slf4j-api:${slf4j_version}"
    testRuntimeOnly "org.slf4j:slf4j-simple:${slf4j_version}"
}

def generatedSourcesDir = layout.buildDirectory.dir("generated/sources/version/main")

tasks.register("generateConstants") {
    def outputDir = generatedSourcesDir.get().asFile
    def modId = mod_id
    def modVersion = mod_version

    outputs.dir(outputDir)

    doLast {
        def packageDir = new File(outputDir, "com/excederus/shaderpatcher")
        packageDir.mkdirs()

        new File(packageDir, "Constants.java").text = """
package com.excederus.shaderpatcher;

public final class Constants {

    public static final String MOD_ID = "${modId}";
    public static final String MOD_VERSION = "${modVersion}";

    private Constants() {}
}
"""
    }
}

sourceSets.main.java.srcDir(generatedSourcesDir)

tasks.named("compileJava") {
    dependsOn("generateConstants")
}