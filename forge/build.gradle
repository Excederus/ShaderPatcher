import org.gradle.language.jvm.tasks.ProcessResources

plugins {
    id 'net.minecraftforge.gradle'
    id 'maven-publish'
}

base {
    archivesName = "ShaderPatcher-forge"
}

jarJar.enable()

minecraft {
    mappings channel: 'official', version: project.minecraft_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    implementation project(":common")

    jarJar(group: 'org.snakeyaml', name: 'snakeyaml-engine', version: '[2.9,2.10)') {
        jarJar.pin(it, '2.9')
    }
}

sourceSets {
    main {
        output.dir(project(":common").sourceSets.main.output)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


tasks.named('processResources', ProcessResources).configure {
    inputs.property('version', project.version)

    filesMatching('META-INF/mods.toml') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named("compileJava") {
    dependsOn(project(":common").tasks.named("classes"))
}

tasks.named("build") {
    dependsOn("reobfJarJar")
}